plugins {
    id 'scala'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '5.2.0'
}

group = 'pro.civitaspo'
version = '0.4.10'

def digdagVersion = '0.10.5.1'
def awsSdkV2Version = "2.42.33"
def scalaSemanticVersion = "2.13.0"
def depScalaVersion = "2.13"

repositories {
    mavenCentral()
}

dependencies {
    compile group: 'io.digdag', name: 'digdag-spi', version: digdagVersion
    compile group: 'io.digdag', name: 'digdag-plugin-utils', version: digdagVersion

    // https://mvnrepository.com/artifact/org.scala-lang/scala-library
    compile group: 'org.scala-lang', name: 'scala-library', version: scalaSemanticVersion
    // https://mvnrepository.com/artifact/software.amazon.awssdk/bom
    compile platform("software.amazon.awssdk:bom:${awsSdkV2Version}")
    // https://mvnrepository.com/artifact/software.amazon.awssdk/athena
    compile 'software.amazon.awssdk:athena'
    // https://mvnrepository.com/artifact/software.amazon.awssdk/s3
    compile 'software.amazon.awssdk:s3'
    // https://mvnrepository.com/artifact/software.amazon.awssdk/sts
    compile 'software.amazon.awssdk:sts'
    // https://mvnrepository.com/artifact/software.amazon.awssdk/glue
    compile 'software.amazon.awssdk:glue'
    // https://mvnrepository.com/artifact/software.amazon.awssdk/apache-client (proxy support)
    compile 'software.amazon.awssdk:apache-client'
    // https://mvnrepository.com/artifact/com.typesafe.scala-logging/scala-logging
    compile group: 'com.typesafe.scala-logging', name: "scala-logging_$depScalaVersion", version: '3.9.2'

}

shadowJar {
    classifier = null
    dependencies {
        exclude(dependency('io.digdag:.*'))
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
    repositories {
        maven {
            url "$buildDir/repo"
        }
    }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

compileScala.options.encoding = 'UTF-8'
compileTestScala.options.encoding = 'UTF-8'
compileScala.options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"

